# Copy to user_config.yaml and fill in. user_config.yaml is gitignored.

account: "your_phone"
password: "your_password"

# Booking date as YYYYMMDD; hours as two-digit 24h (00–23)
date: "20250327"
start_time: "09"
end_time: "11"

# alumni | iaaa (IAAA not implemented in code yet)
login_method: "alumni"

# Set to true to save all encountered captcha images to data/captcha/ for benchmarking.
save_captcha: false

# Optional: third-party captcha API key (keep in this file only)
captcha:
  api_key: ""

# Optional: override anything from site_config.yaml, e.g.:
# browser:
#   headless: true
