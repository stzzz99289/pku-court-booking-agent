<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Sign in — PKU Court Booking</title>
  <link rel="stylesheet" href="/static/vendor/pico.min.css?v={{ asset_version('vendor/pico.min.css') }}">
  <link rel="stylesheet" href="/static/app.css?v={{ asset_version('app.css') }}">
</head>
<body class="login-page">
  <main class="content login-wrap">
    <section class="panel login-panel">
      <div class="login-brand">
        <span class="brand-mark" aria-hidden="true">PK</span>
        <div><h1>Welcome back</h1><p>Sign in to manage court bookings.</p></div>
      </div>
      {% if error %}
        <p class="login-error">Invalid username or password.</p>
      {% endif %}
      <form method="post" action="/login" class="form-grid">
        <input type="hidden" name="next" value="{{ next }}">
        <label>Username
          <input type="text" name="username" autocomplete="username" autofocus required>
        </label>
        <label>Password
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <div class="form-actions">
          <button type="submit" class="btn">Sign in</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
