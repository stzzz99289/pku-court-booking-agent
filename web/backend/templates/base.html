<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}PKU Court Booking{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <h1>PKU Court Booking — Control Panel</h1>
    <nav class="tabs">
      <a href="/" class="tab {% if active_tab == 'users' %}active{% endif %}">Users &amp; Orders</a>
      <a href="/run" class="tab {% if active_tab == 'run' %}active{% endif %}">Run Booking</a>
      <a href="/schedule" class="tab {% if active_tab == 'schedule' %}active{% endif %}">Scheduled Task</a>
      <a href="/logout" class="tab logout">Sign out</a>
    </nav>
  </header>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
