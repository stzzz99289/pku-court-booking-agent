[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pku-court-booking-agent"
version = "0.1.0"
description = "Automated PKU court booking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0",
    "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
