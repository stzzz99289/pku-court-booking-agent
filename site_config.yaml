# Site defaults: URLs, browser profile, captcha provider (non-secret), Playwright selectors.
# Commit and update when the booking website UI changes.

base_url: "https://epe.pku.edu.cn/venue/home"

# Direct navigation to the court booking page (skips venue list click-through).
# Set to the numeric ID from the URL: https://epe.pku.edu.cn/venue/venue-reservation/85
venue_id: 85 # 54 tennis
# venue_id: 64 
user_data_dir: "./.browser_profile"

headless: false  # run Chromium headless; when true, browser auto-closes on finish
save_captcha: false  # save captcha images to data/captcha/ for benchmarking
debug: false  # use manual stdin solver instead of API solvers

# Scheduled booking: wait until a precise time before starting the booking flow.
# Useful for booking courts that become available at a specific time (e.g. 12:00:00).
scheduled_mode: false
scheduled_time: "120000"        # Target time in HHMMSS 24-h format
scheduled_window_minutes: 3     # Program must start within this many minutes before scheduled_time

browser:
  slow_mo_ms: 0


selectors:
  # Top-right "登录" is a clickable generic/div, not an <a>, so role=link does not match.
  login_button: 'text=/^登录$/'
  login_mode_iaaa: 'text=校内师生登录'
  login_mode_alumni: 'text=校友登录'
  username_input: 'role=textbox[name="手机号"]'
  password_input: 'role=textbox[name="密码"]'
  login_captcha_image: 'img[src^="blob"]'
  login_captcha_input: 'role=textbox[name="验证码"]'
  login_captcha_refresh: ""
  login_submit: 'role=button[name="登录"]'
  # Optional explicit marker; if empty, code still treats visible 退出 / 欢迎您 as logged-in (saved session).
  logged_in_indicator: ""

  agreement_checkbox: "input.ivu-checkbox-input"
  booking_submit: ".submit_order_box .btn"
  booking_captcha_image: ""
  booking_captcha_input: ""
  proceed_to_pay: ".btn-group .btn:not(.cancel)"

  user_page_url_substring: "user"
  booking_success_indicator: ""
