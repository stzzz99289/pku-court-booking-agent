# Site config for the CLI (`python main.py`).
# URL, browser tuning, and Playwright selectors are site-invariant and live
# in src/booking/site_constants.py — only user-tunable settings go here.

user_data_dir: "./.browser_profile"

headless: true         # run Chromium headless; when true, browser auto-closes on finish
save_captcha: false    # save captcha images to data/captcha/ for benchmarking
debug: false           # use manual stdin solver instead of API solvers

# Scheduled booking: wait until a precise time before submitting.
# Useful for slots that open at a fixed time (e.g. 12:00:00).
scheduled_mode: false
scheduled_time: "120000"        # HHMMSS 24-h format
scheduled_window_minutes: 3     # max minutes early the program may start
scheduled_fire_offset_ms: 500   # delay past scheduled_time before the post-fire refresh; raises hit rate on the new date
