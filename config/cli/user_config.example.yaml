# Copy to user_config.yaml and fill in. user_config.yaml is gitignored.

# Login identities. Each entry is one account that can be referenced by workers.
# login_method: alumni | iaaa   (IAAA not implemented in code yet)
# name: a short unique identifier used in the workers list below.
users:
  - name: "alice"
    login_method: "alumni"
    account: "your_phone"
    password: "your_password"
  # - name: "bob"
  #   login_method: "alumni"
  #   account: "13800000000"
  #   password: "another_password"

# Run Chromium headless. In headless mode you only see status via terminal
# output; the browser is auto-closed and the program exits when the flow ends.
# Note: paid bookings cannot be completed in headless mode — the
# wechat/alipay popup has nowhere to render. Use headed mode for those.
headless: false

# Venue to book. Numeric ID from the URL https://epe.pku.edu.cn/venue/venue-reservation/<id>.
# See VENUES in src/booking/site_constants.py for known names:
#   64 → 邱德拔体育馆-B1台球厅
#   85 → 五四体育中心-室外网球场
venue_id: 85

# ChaoJiYing (超级鹰) captcha solver — https://www.chaojiying.com
# Register an account, create a software ID in the dashboard, then fill in below.
# Falls back to local ddddocr if the API returns an error.
captcha:
  username: ""
  api_key: ""   # your chaojiying login password
  softid: ""    # software ID from your chaojiying dashboard

# Booking workers: each entry books for one user on one date.
# With 1 worker the program runs as a single booking flow (no extra processes).
# With N workers, N browser processes run in parallel.
# user: must match one of the `name` values in the `users` list above.
# date: either YYYYMMDD (e.g. "20250327") or "N-days-later" (e.g. "3-days-later"
#       → resolved at launch time to today + N days; 0 ≤ N ≤ 14).
# start_time_list: ordered priority list of 2-digit start hours (06–21). Each
#   entry is a one-hour booking (e.g. '09' → 09:00–10:00). The worker tries
#   slots in the order given and stops at the first one that succeeds; if a
#   slot is already booked by someone else, it refreshes and tries the next.
workers:
  - user: "alice"
    date: "3-days-later"
    start_time_list: ['09', '10', '11', '20', '21']
  # - user: "bob"
  #   date: "20250327"
  #   start_time_list: ['10', '11']

# Optional: override anything from site_config.yaml, e.g.:
# browser:
#   slow_mo_ms: 150
